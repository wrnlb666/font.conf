<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<fontconfig>

    <!-- Windows 的 .fon 位图字体容易抢占 system-ui/System 等匹配，现代桌面一般不需要。 -->
    <selectfont>
        <rejectfont>
            <glob>/home/wrnlb/.local/share/fonts/windows/*.fon</glob>
            <pattern>
                <patelt name="fontformat"><string>Windows FNT</string></patelt>
            </pattern>
        </rejectfont>
    </selectfont>

    <!-- =========================================================
         通用字体别名
         Windows 字体优先，思源/Noto/DejaVu 作为回退
         ========================================================= -->

    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Segoe UI</family>
            <family>Arial</family>
            <family>Microsoft YaHei UI</family>
            <family>Microsoft YaHei</family>
            <family>Source Han Sans CN</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans</family>
            <family>Liberation Sans</family>
            <family>DejaVu Sans</family>
        </prefer>
    </alias>

    <alias>
        <family>serif</family>
        <prefer>
            <family>Times New Roman</family>
            <family>SimSun</family>
            <family>NSimSun</family>
            <family>Source Han Serif CN</family>
            <family>Noto Serif CJK SC</family>
            <family>Noto Serif</family>
            <family>Liberation Serif</family>
            <family>DejaVu Serif</family>
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>Maple Mono NF CN</family>
            <family>JetBrainsMono Nerd Font</family>
            <family>JetBrainsMono Nerd Font Mono</family>
            <family>Cascadia Mono</family>
            <family>Cascadia Code</family>
            <family>Consolas</family>
            <family>Sarasa Mono SC</family>
            <family>Noto Sans Mono CJK SC</family>
            <family>Liberation Mono</family>
            <family>DejaVu Sans Mono</family>
        </prefer>
    </alias>

    <alias>
        <family>system-ui</family>
        <prefer>
            <family>Segoe UI</family>
            <family>Microsoft YaHei UI</family>
            <family>Microsoft YaHei</family>
            <family>Source Han Sans CN</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans</family>
            <family>Liberation Sans</family>
        </prefer>
    </alias>

    <alias>
        <family>ui-sans-serif</family>
        <default>
            <family>sans-serif</family>
        </default>
    </alias>

    <alias>
        <family>ui-serif</family>
        <default>
            <family>serif</family>
        </default>
    </alias>

    <alias>
        <family>ui-monospace</family>
        <default>
            <family>monospace</family>
        </default>
    </alias>

    <!-- Omarchy Quattro resolves generic sans-serif to Liberation Sans before this
         user config is read. Add Chinese fonts as fallbacks without replacing
         Liberation Sans for Latin text. -->
    <alias>
        <family>Liberation Sans</family>
        <accept>
            <family>Microsoft YaHei UI</family>
            <family>Microsoft YaHei</family>
            <family>Source Han Sans CN</family>
            <family>Noto Sans CJK SC</family>
        </accept>
    </alias>

    <!-- =========================================================
         常见通用字体映射
         ========================================================= -->

    <match target="pattern">
        <test name="family" compare="eq">
            <string>sans</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>sans-serif</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>system-ui</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>sans-serif</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>ui-sans-serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>sans-serif</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>ui-serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>serif</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>ui-monospace</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>monospace</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>sans serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>sans-serif</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>serif</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>mono</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>monospace</string>
        </edit>
    </match>


    <!-- =========================================================
         Helvetica / Arial / Times / Courier 映射
         ========================================================= -->

    <match target="pattern">
        <test name="family" compare="eq">
            <string>Helvetica</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Arial</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>Helvetica Neue</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Arial</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>Times</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Times New Roman</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" compare="eq">
            <string>Courier</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Courier New</string>
        </edit>
    </match>


    <!-- =========================================================
         CJK language priority

         Omarchy resolves generic families before this file is read, so rules
         limited to "sans-serif" never matched. Language is the reliable signal
         supplied by an application.  Unspecified CJK fallback remains
         Simplified Chinese; explicit Traditional Chinese and Japanese requests
         override it below.
         ========================================================= -->

    <!-- Generic Chinese (without a region) defaults to Simplified Chinese. -->
    <match target="pattern">
        <test name="lang" compare="eq">
            <string>zh</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Microsoft YaHei UI</string>
            <string>Microsoft YaHei</string>
            <string>Source Han Sans CN</string>
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="eq">
            <string>zh-cn</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Microsoft YaHei UI</string>
            <string>Microsoft YaHei</string>
            <string>Source Han Sans CN</string>
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="eq">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Microsoft JhengHei UI</string>
            <string>Microsoft JhengHei</string>
            <string>Source Han Sans TC</string>
            <string>Noto Sans CJK TC</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="lang" compare="eq">
            <string>zh-hk</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Microsoft JhengHei UI</string>
            <string>Microsoft JhengHei</string>
            <string>Source Han Sans HC</string>
            <string>Noto Sans CJK HK</string>
        </edit>
    </match>

    <!-- Only an explicit Japanese language request selects Japanese glyphs. -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>ja</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK JP</string>
            <string>MS Gothic</string>
            <string>MS PGothic</string>
        </edit>
    </match>


    <!-- =========================================================
         全局抗锯齿和渲染设置
         ========================================================= -->

    <match target="font">

        <!-- 开启抗锯齿 -->
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>

        <!-- 开启字体微调 -->
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>

        <!-- 轻度微调，通常比 hintfull 更自然 -->
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>

        <!-- 普通横向 LCD 通常为 RGB -->
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>

        <!-- LCD 次像素滤镜 -->
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>

        <!-- 优先使用字体自身的 hinting 信息 -->
        <edit name="autohint" mode="assign">
            <bool>false</bool>
        </edit>

        <!-- 默认禁用内嵌位图，避免老式 .fon 位图字体被误选 -->
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>

    </match>


    <!-- =========================================================
         小字号宋体使用内嵌点阵
         ========================================================= -->

    <match target="font">
        <test name="family" compare="eq">
            <string>SimSun</string>
        </test>
        <test name="pixelsize" compare="less_eq">
            <double>16</double>
        </test>
        <edit name="embeddedbitmap" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <match target="font">
        <test name="family" compare="eq">
            <string>NSimSun</string>
        </test>
        <test name="pixelsize" compare="less_eq">
            <double>16</double>
        </test>
        <edit name="embeddedbitmap" mode="assign">
            <bool>true</bool>
        </edit>
    </match>


    <!-- =========================================================
         微软雅黑不使用内嵌点阵
         ========================================================= -->

    <match target="font">
        <test name="family" compare="eq">
            <string>Microsoft YaHei</string>
        </test>
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>

    <match target="font">
        <test name="family" compare="eq">
            <string>Microsoft YaHei UI</string>
        </test>
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>


    <!-- =========================================================
         Segoe UI 不使用内嵌点阵
         ========================================================= -->

    <match target="font">
        <test name="family" compare="eq">
            <string>Segoe UI</string>
        </test>
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>


    <!-- =========================================================
         Consolas / Cascadia 等宽字体设置
         ========================================================= -->

    <match target="font">
        <test name="family" compare="eq">
            <string>Consolas</string>
        </test>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>

    <match target="font">
        <test name="family" compare="eq">
            <string>Cascadia Mono</string>
        </test>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>

    <match target="font">
        <test name="family" compare="eq">
            <string>Cascadia Code</string>
        </test>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>

    <!-- Omarchy rewrites a generic monospace request to JetBrains before this
         user configuration is read. Replace that post-rewrite result with
         Maple, which is the preferred system monospace family. -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend_first" binding="strong">
            <string>Maple Mono NF CN</string>
        </edit>
    </match>
</fontconfig>
